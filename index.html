<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard / FieldOps</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="menu-lateral">

        <h1>Menu Inicial</h1>
        <div class="menu-opcoes">

    <a href="clientes.html" class="opcao-clientes">
        <i class="bi bi-people-fill"></i>
        Clientes
    </a>
    <a href="#" class="opcao-OS">
        <i class="bi bi-clipboard-check"></i>
        Ordens de serviço
    </a>
    <a href="#" class="opcao-Inspecoes">
        <i class="bi bi-search"></i>
        Inspeções
    </a>
</div>

    </div>
    </div>
    <header class="cabecalho">

        <div class="titulo-dashboard">
            <i class="bi bi-speedometer2"></i>
            <h2>Dashboard</h2>
        </div>

        <div class="usuario">
            <i class="bi bi-person-circle"></i>
            <span>Usuário</span>
        </div>

    </header> 

<div class="area-dashboard">

    <div class="row g-4">

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card-dashboard">

                <div class="icone-card">
                    <i class="bi bi-people-fill"></i>
                </div>

                <div>
                    <h3>Clientes</h3>
                    <p>24</p>
                </div>

            </div>
        </div>

        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card-dashboard">

                <div class="icone-card">
                    <i class="bi bi-clock-history"></i>
                </div>

                <div>
                    <h3>Pendentes</h3>
                    <p>12</p>
                </div>

            </div>
        </div>


        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card-dashboard">

                <div class="icone-card">
                    <i class="bi bi-arrow-repeat"></i>
                </div>

                <div>
                    <h3>Em andamento</h3>
                    <p>5</p>
                </div>

            </div>
        </div>


        <div class="col-12 col-sm-6 col-lg-3">
            <div class="card-dashboard">

                <div class="icone-card">
                    <i class="bi bi-check-circle-fill"></i>
                </div>

                <div>
                    <h3>Concluídas</h3>
                    <p>28</p>
                </div>

            </div>
        </div>

    </div>

        <!-- PROGRESSÃO DAS ORDENS DE SERVIÇO -->
<div class="row g-4 mt-2">

    <div class="col-12 col-lg-7">
        <div class="quadro-progressao">

            <div class="titulo-quadro">
                <i class="bi bi-bar-chart-fill"></i>
                <h3>Progressão das OS</h3>
            </div>

            <!-- PENDENTES -->
            <div class="progresso-item">
                <div class="progresso-info">
                    <span>Pendentes</span>
                    <strong>12</strong>
                </div>

                <div class="barra">
                    <div class="barra-preenchida pendentes"></div>
                </div>
            </div>

            <!-- EM ANDAMENTO -->
            <div class="progresso-item">
                <div class="progresso-info">
                    <span>Em andamento</span>
                    <strong>5</strong>
                </div>

                <div class="barra">
                    <div class="barra-preenchida andamento"></div>
                </div>
            </div>

            <!-- CONCLUÍDAS -->
            <div class="progresso-item">
                <div class="progresso-info">
                    <span>Concluídas</span>
                    <strong>28</strong>
                </div>

                <div class="barra">
                    <div class="barra-preenchida concluidas"></div>
                </div>
            </div>

        </div>
    </div>

</div>

</div>

        

</body>

</html>
